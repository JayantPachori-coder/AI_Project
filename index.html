<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Schedule</title>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            /* ✅ Full-page high-quality online background */
            background: url('https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=1920&q=80') 
                        no-repeat center center fixed;
            background-size: cover;
        }

        /* Transparent dark overlay for readability */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.55);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 { 
            color: white; 
            margin-bottom: 40px; 
            font-size: 50px;
            letter-spacing: 1px;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.7);
        }

        .button-group {
            display: flex;
            gap: 50px;
            margin-top: 20px;
        }

        a {
            text-decoration: none;
            padding: 15px 40px;
            background-color: #007bff;
            color: white;
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        a:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        footer {
            position: absolute;
            bottom: 15px;
            color: #fff;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div class="overlay">
        <h1>Smart Schedule</h1>
        <div class="button-group">
            <a href="{{ url_for('student_login') }}">Student Portal</a>
            <a href="{{ url_for('teacher_login') }}">Teacher Portal</a>
        </div>
        <footer>© 2025 Smart Schedule | Powered by AI</footer>
    </div>
</body>
</html>
