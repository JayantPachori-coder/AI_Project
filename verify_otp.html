<!DOCTYPE html>
<html>
<head>
  <title>OTP Verification</title>
  <style>
    body {
      margin: 0; padding: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      background: url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f') no-repeat center center fixed;
      background-size: cover;
    }
    .blur-bg {
      position: fixed; width: 100%; height: 100%;
      backdrop-filter: blur(8px); background-color: rgba(0,0,0,0.4);
      display: flex; justify-content: center; align-items: center;
    }
    .otp-container {
      background: rgba(255,255,255,0.2);
      padding: 40px; border-radius: 15px;
      text-align: center; color: white; width: 300px;
    }
    input { width: 90%; padding: 10px; margin: 10px 0; border-radius:8px; border:none; outline:none; text-align:center; }
    button { width: 100%; padding: 10px; border:none; border-radius:8px; background:#28a745; color:white; font-size:16px; cursor:pointer; }
    button:hover { background:#1e7e34; }
  </style>
</head>
<body>
  <div class="blur-bg">
    <div class="otp-container">
      <h2>Enter OTP</h2>
      <form method="POST">
        <input type="text" name="otp" placeholder="6-digit OTP" required><br>
        <button type="submit">Verify</button>
      </form>
    </div>
  </div>
</body>
</html>
