<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Schedule | Student Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(120deg, #007bff, #6f42c1);
            color: #fff;
            min-height: 100vh;
        }
        .container {
            margin-top: 60px;
            background: #ffffff10;
            padding: 30px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
        }
        h2 { text-align: center; margin-bottom: 20px; }
        .btn-add {
            background: #00c3ff;
            color: white;
            border: none;
        }
        .btn-add:hover {
            background: #008bd1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome, {{ username }} 👋</h2>
        <p class="text-center">Fill in your subjects to generate your Smart Schedule</p>

        <!-- ✅ Corrected form action -->
        <form action="{{ url_for('student_schedule') }}" method="POST" id="scheduleForm">
            <div id="subjectContainer">
                <div class="row mb-3">
                    <div class="col-md-3">
                        <input type="text" name="subject[]" class="form-control" placeholder="Subject" required>
                    </div>
                    <div class="col-md-3">
                        <input type="number" name="difficulty[]" class="form-control" placeholder="Difficulty (1-5)" required>
                    </div>
                    <div class="col-md-3">
                        <input type="number" name="performance[]" class="form-control" placeholder="Performance (1-5)" required>
                    </div>
                    <div class="col-md-3">
                        <input type="number" name="hours[]" class="form-control" placeholder="Hours" required>
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-add" onclick="addSubject()">+ Add Another Subject</button>
            <button type="submit" class="btn btn-success float-end">Generate Schedule</button>
        </form>
    </div>

    <script>
        function addSubject() {
            let container = document.getElementById('subjectContainer');
            let newRow = document.createElement('div');
            newRow.className = 'row mb-3';
            newRow.innerHTML = `
                <div class="col-md-3">
                    <input type="text" name="subject[]" class="form-control" placeholder="Subject" required>
                </div>
                <div class="col-md-3">
                    <input type="number" name="difficulty[]" class="form-control" placeholder="Difficulty (1-5)" required>
                </div>
                <div class="col-md-3">
                    <input type="number" name="performance[]" class="form-control" placeholder="Performance (1-5)" required>
                </div>
                <div class="col-md-3">
                    <input type="number" name="hours[]" class="form-control" placeholder="Hours" required>
                </div>`;
            container.appendChild(newRow);
        }
    </script>
</body>
</html>
