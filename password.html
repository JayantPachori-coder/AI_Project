<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password - Smart Schedule</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .overlay {
            background-color: rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 5px black;
            font-size: 28px;
            text-align: center;
        }

        label {
            color: white;
            font-size: 16px;
            margin-bottom: 10px;
            align-self: flex-start;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px 15px;
            background-color: #4CAF50;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        .back-link {
            margin-top: 15px;
            color: #ffffff;
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>Forgot Password</h1>
        <form action="{{ url_for('forgot_password') }}" method="POST">
            <label for="email">Enter your registered email</label>
            <input type="email" id="email" name="email" placeholder="Email" required>
            <button type="submit">Reset Password</button>
        </form>
        <a class="back-link" href="{{ url_for('student_login') }}">Back to Login</a>
    </div>
</body>
</html>
