<!DOCTYPE html>
<html>
<head>
  <title>Student Login</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      background: url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f') no-repeat center center fixed;
      background-size: cover;
    }

    .blur-bg {
      position: fixed;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(8px);
      background-color: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.2);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      text-align: center;
      width: 300px;
      color: white;
    }

    .login-container h2 {
      margin-bottom: 20px;
    }

    .login-container input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      outline: none;
      text-align: center;
    }

    .login-container button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: #28a745;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-container button:hover {
      background-color: #1e7e34;
    }

    .login-container a {
      color: #00c3ff;
      text-decoration: none;
      display: block;
      margin-top: 10px;
    }

    .login-container a:hover {
      text-decoration: underline;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 15px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="blur-bg">
    <div class="login-container">
      <img src="https://cdn-icons-png.flaticon.com/512/3135/3135789.png" alt="Student Logo" class="logo">
      <h2>Student Login</h2>
      <form method="POST">
        <input type="text" name="username" placeholder="Username" required><br>
        <input type="password" name="password" placeholder="Password" required><br>
        <button type="submit">Login</button>
        <a href="/student_register">New User? Register</a>
        <a href="/password">Forgot Password?</a>
      </form>
    </div>
  </div>
</body>
</html>
