<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Generated Schedule</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body { background: #f8f9fa; padding: 50px; }
        .card { margin: auto; width: 80%; }
        h2 { color: #0d6efd; }
    </style>
</head>
<body>
    <div class="card shadow-lg p-4">
        <h2 class="text-center mb-4">📅 Your Smart Schedule</h2>
        <table class="table table-bordered text-center">
            <thead class="table-primary">
                <tr>
                    <th>Subject</th>
                    <th>Time Block</th>
                    <th>Scheduled Time</th>
                </tr>
            </thead>
            <tbody>
                {% for item in schedule %}
                <tr>
                    <td>{{ item.subject }}</td>
                    <td>{{ item.time_block }}</td>
                    <td>{{ item.scheduled_time }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <div class="text-center mt-4">
            <a href="{{ url_for('download_schedule', student_id=session['student_id']) }}" class="btn btn-success">
                ⬇️ Download Schedule as PDF
            </a>
            <a href="{{ url_for('studentDashboard') }}" class="btn btn-secondary">🔙 Back</a>
        </div>
    </div>
</body>
</html>
