<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teacher Profile</title>
    <style>
        /* Basic page styling */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #1e1e2f; /* Dark background */
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('{{ url_for("static", filename="download.jpg") }}'); /* Replace with your image URL */
            background-size: cover;
            background-position: center;
        }

        .profile-container {
            background: rgba(30, 30, 50, 0.85); /* Semi-transparent dark overlay */
            padding: 40px 60px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            max-width: 500px;
            width: 100%;
        }

        .profile-container h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            color: #ffcc00;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 12px 15px;
        }

        th {
            background-color: #333355;
            border-radius: 5px 0 0 5px;
            color: #ffcc00;
            width: 40%;
        }

        td {
            background-color: #2a2a3f;
            border-radius: 0 5px 5px 0;
        }

        tr + tr td {
            border-top: 1px solid #444466;
        }

        /* Animation for table rows */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s forwards;
        }

        .fade-in:nth-child(1) { animation-delay: 0.2s; }
        .fade-in:nth-child(2) { animation-delay: 0.4s; }
        .fade-in:nth-child(3) { animation-delay: 0.6s; }
        .fade-in:nth-child(4) { animation-delay: 0.8s; }
        .fade-in:nth-child(5) { animation-delay: 1s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <h1>My Profile</h1>
        <table>
            <tr class="fade-in"><th>First Name</th><td>{{ teacher.first_name }}</td></tr>
            <tr class="fade-in"><th>Last Name</th><td>{{ teacher.last_name }}</td></tr>
            <tr class="fade-in"><th>Email</th><td>{{ teacher.email }}</td></tr>
            <tr class="fade-in"><th>Phone</th><td>{{ teacher.phone_number }}</td></tr>
            <tr class="fade-in"><th>Username</th><td>{{ teacher.username }}</td></tr>
        </table>
    </div>
</body>
</html>
